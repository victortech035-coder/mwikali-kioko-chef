<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal Sign-In | Chef Mwikali Kioko</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <div class="admin-login-wrapper">
      <div class="admin-login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h2 style="font-size: 1.75rem; color: var(--color-forest); margin-bottom: 0.25rem;">Mwikali Kioko</h2>
          <span style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--color-gold); font-weight: 600;">Chef &amp; Catering Admin Portal</span>
        </div>

        <form id="admin-login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="admin-email">Administrator Email</label>
            <input type="email" id="admin-email" class="form-input" autocomplete="username" required />
          </div>

          <div class="form-group" style="margin-bottom: 1.75rem;">
            <label class="form-label" for="admin-password">Password</label>
            <input type="password" id="admin-password" class="form-input" autocomplete="current-password" required />
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1.25rem;">
            Sign In to Dashboard
          </button>

          <div style="text-align: center;">
            <a href="/" style="font-size: 0.88rem; color: var(--color-muted);">&larr; Return to Public Website</a>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script>
      async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;

        try {
          btn.disabled = true;
          btn.textContent = 'Verifying Credentials...';
          await window.Auth.login(email, password);
          window.location.href = '/admin/dashboard.html';
        } catch (err) {
          window.showToast?.(err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In to Dashboard';
        }
      }

      // If already authenticated, redirect directly
      if (window.Auth && window.Auth.isAuthenticated()) {
        window.location.href = '/admin/dashboard.html';
      }
    </script>
  </body>
</html>
